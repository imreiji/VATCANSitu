name: Build artifact from latest code changes

on:
  push:
    branches:
      - master
  # Also build pull requests, so changes get a real compile check before they
  # reach master rather than after.
  pull_request:

jobs:
  build:
    # windows-2019 was fully unsupported from 2025-06-30 and any job requesting it
    # fails immediately. windows-2022 still ships the v142 toolset and ATL/MFC that
    # this project targets.
    runs-on: windows-2022
    steps:
    - name: Checkout vatcansitu
      uses: actions/checkout@v3

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # The image ships the v142 toolset but only ATL/MFC for v143, so a v142 build
    # fails PrepareForBuild with MSB8041. Install the v142 MFC libraries rather than
    # retargeting the project, so CI keeps building what actually ships.
    - name: Install MFC for the v142 toolset
      shell: pwsh
      run: |
        $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
        $vsPath = & "$installerDir\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio: $vsPath"

        # Invoke through cmd.exe. Passing --installPath straight from a PowerShell
        # -ArgumentList array mangles the quoting around the space in "Program Files"
        # and vs_installer rejects it with exit code 87 (ERROR_INVALID_PARAMETER).
        Set-Location $installerDir
        $arguments = @(
          '/c', 'vs_installer.exe', 'modify',
          '--installPath', "`"$vsPath`"",
          '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC',
          '--quiet', '--norestart', '--nocache'
        )
        $proc = Start-Process -FilePath cmd.exe -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden

        # 3010 means success but a reboot is pending, which does not matter here.
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          throw "vs_installer failed with exit code $($proc.ExitCode)"
        }

        # Fail loudly here rather than 20 lines later inside MSBuild.
        $mfc = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter afxwin.h -Recurse -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if (-not $mfc) { throw "afxwin.h still not present after installing the MFC component" }
        Write-Host "Found MFC headers at $($mfc.FullName)"

    # Scratchpad.h depends on nothing but <string>, so these run without MFC or the
    # EuroScope SDK. They compare the parser against the original hand written logic over
    # a corpus, which is what makes it safe to change code that writes a field every other
    # controller on the network can see.
    - name: Run standalone tests
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        if not exist testbin md testbin
        cl /nologo /EHsc /W4 /std:c++17 tests\ScratchpadTests.cpp /Fe:testbin\ScratchpadTests.exe /Fo:testbin\ || exit /b 1
        testbin\ScratchpadTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\PositionStringTests.cpp /Fe:testbin\PositionStringTests.exe /Fo:testbin\ || exit /b 1
        testbin\PositionStringTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\UrlEncodeTests.cpp /Fe:testbin\UrlEncodeTests.exe /Fo:testbin\ || exit /b 1
        testbin\UrlEncodeTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\ConfigFileTests.cpp /Fe:testbin\ConfigFileTests.exe /Fo:testbin\ || exit /b 1
        testbin\ConfigFileTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcAtisTests.cpp /Fe:testbin\CpdlcAtisTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcAtisTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\TbsConfigTests.cpp /Fe:testbin\TbsConfigTests.exe /Fo:testbin\ || exit /b 1
        testbin\TbsConfigTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\SettingsFileTests.cpp /Fe:testbin\SettingsFileTests.exe /Fo:testbin\ || exit /b 1
        testbin\SettingsFileTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcPacketTests.cpp /Fe:testbin\CpdlcPacketTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcPacketTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcStationsTests.cpp /Fe:testbin\CpdlcStationsTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcStationsTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcDclTests.cpp /Fe:testbin\CpdlcDclTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcDclTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcFreetextTests.cpp /Fe:testbin\CpdlcFreetextTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcFreetextTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcUplinkTests.cpp /Fe:testbin\CpdlcUplinkTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcUplinkTests.exe || exit /b 1
        cl /nologo /EHsc /W4 /std:c++17 tests\CpdlcErrorTests.cpp /Fe:testbin\CpdlcErrorTests.exe /Fo:testbin\ || exit /b 1
        testbin\CpdlcErrorTests.exe || exit /b 1

    - name: Build artifact from source
      run: msbuild "${env:GITHUB_WORKSPACE}\VATCANSitu.vcxproj"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Plugin DLL
        path: Debug\VATCANSitu.dll
